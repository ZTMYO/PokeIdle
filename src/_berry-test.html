<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  body { background: #73c5a4; margin: 10px; font-family: monospace; }
  .berry-frame {
    width: 32px; height: 32px;
    background-repeat: no-repeat;
    image-rendering: pixelated;
    border: 1px solid red;
    margin: 4px;
    display: inline-block;
  }
  @keyframes berry-frames {
    from { background-position: var(--bfrom, 0) 0; }
    to   { background-position: var(--bto, 0) 0; }
  }
</style>
</head>
<body>
  <div>1 sprout 编码+动画:</div>
  <div class="berry-frame" style="background-image:url('./items/berry-trees/sprout.png');background-size:64px 32px;background-position:0px 0;--bfrom:0px;--bto:-64px;animation:berry-frames 0.9s steps(2, end) infinite;"></div>
  <div>2 aspear 编码+动画:</div>
  <div class="berry-frame" style="background-image:url('./items/berry-trees/aspear.png');background-size:192px 32px;background-position:0px 0;--bfrom:0px;--bto:-64px;animation:berry-frames 0.9s steps(2, end) infinite;"></div>
  <div>3 aspear 原始+动画:</div>
  <div class="berry-frame" style="background-image:url('./items/berry-trees/aspear.png');background-size:192px 32px;background-position:0px 0;--bfrom:0px;--bto:-64px;animation:berry-frames 0.9s steps(2, end) infinite;"></div>
  <div>4 aspear 静态帧0 无动画:</div>
  <div class="berry-frame" style="background-image:url('./items/berry-trees/aspear.png');background-size:192px 32px;background-position:0px 0;"></div>
  <div>5 aspear 静态帧4(成熟):</div>
  <div class="berry-frame" style="background-image:url('./items/berry-trees/aspear.png');background-size:192px 32px;background-position:-128px 0;"></div>
</body>
</html>
