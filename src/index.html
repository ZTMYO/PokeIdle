<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="battle-fx.css" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>口袋挂机</title>
  <script type="module" src="./main.js" defer></script>
</head>

<body>
  <div class="console">
    <!-- 标题栏 -->
    <div class="title-bar">
      <div id="appTitle" class="app-title">口袋挂机</div>
      <div class="window-controls">
        <button class="control-btn window-icon" id="btnPhone" data-view="phoneView" aria-label="手机" title="手机">
          <svg>
            <use xlink:href="./icons/sprites.svg#icon-phone" />
          </svg>
          <span class="title-bar-badge" id="title-badge-phone" style="display:none;"></span>
        </button>
        <button class="control-btn window-icon" id="btnStation" data-view="bountyView" aria-label="地区悬赏" title="地区悬赏">
          <svg>
            <use xlink:href="./icons/sprites.svg#icon-station" />
          </svg>
          <span class="title-bar-badge" id="title-badge-bounty" style="display:none;"></span>
        </button>
        <button class="control-btn window-icon" id="btnShop" data-view="shopView" aria-label="商店" title="商店">
          <svg>
            <use xlink:href="./icons/sprites.svg#icon-shop" />
          </svg>
        </button>
        <button class="control-btn window-icon" id="btnSettings" data-view="settingsView" aria-label="设置" title="设置">
          <svg>
            <use xlink:href="./icons/sprites.svg#icon-settings" />
          </svg>
        </button>
        <span class="intro-mute-hint" id="introMusicHint" style="display:none;">点击这里关闭音乐→</span>
        <button class="control-btn mute-toggle" id="btnIntroMusic" aria-label="关闭音乐" title="关闭音乐" style="display:none;">
          <svg id="introMusicIconOn" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg" width="24" height="24"><path fill="currentColor" d="M1024 75.3c0-11.9-4.9-23.2-13.6-31.3s-20.3-12.2-32.1-11.3L303.9 82c-22.3 1.6-39.6 20.2-39.6 42.5v551.8c-26.3-15.4-56.7-24.7-89.5-24.7C78.4 651.7 0 727.9 0 821.5s78.4 169.9 174.9 169.9 174.9-76.2 174.9-169.9c0-1.1-0.3-2.1-0.3-3.2 0-0.6 0.3-1.1 0.3-1.6V345.5l589-43.1V546c-26.3-15.4-56.7-24.7-89.5-24.7-96.4 0-174.9 76.2-174.9 169.8S752.8 861 849.3 861 1024 784.7 1024 691.1c0-2.5-0.6-4.8-0.8-7.2 0.1-1.3 0.8-2.4 0.8-3.7V75.3zM174.9 906.1c-49.4 0-89.5-37.9-89.5-84.5s40.2-84.5 89.5-84.5 89.5 37.9 89.5 84.5-40.2 84.5-89.5 84.5zM349.7 260v-95.8l589-43V217l-589 43z m499.4 515.6c-49.4 0-89.5-37.9-89.5-84.5s40.2-84.5 89.5-84.5c49.4 0 89.5 37.9 89.5 84.5 0.1 46.6-40.1 84.5-89.5 84.5z"/></svg>
          <svg id="introMusicIconOff" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg" width="24" height="24" style="display:none;"><path fill="currentColor" d="M1010.4 870.9L909.1 777.1c28-28 45.5-65.5 45.5-106.9 0-2.2-0.6-4.2-0.7-6.3 0.1-1.2 0.7-2.2 0.7-3.4V121.8c0-11.8-4.9-23.1-13.6-31.2-8.6-8-20.2-12.3-32.1-11.3l-624.4 43.9c-21.4 1.5-37.7 18.7-39.1 39.8L167.1 90.4c-17.3-16-44.3-15-60.3 2.3S91.8 137 109.1 153l135.8 125.6v372c-23.8-12.5-50.7-20.3-79.8-20.3-91 0-165.1 70-165.1 156s74 155.9 165.1 155.9 165.1-70 165.1-155.9c0-1-0.3-1.8-0.3-2.8 0-0.5 0.3-1 0.3-1.5V366.9l9.3-0.7 289.8 268.2c-2.9 11.5-4.8 23.4-4.8 35.8 0 86 74.1 156 165.1 156 14.2 0 27.8-2.2 41-5.5l121.9 112.8c8.2 7.6 18.6 11.3 29 11.3 11.5 0 22.9-4.6 31.3-13.7 16-17.2 14.9-44.2-2.4-60.2zM736.8 617.7c14.1-11.1 32.4-18.1 52.7-18.1 44 0 79.7 31.7 79.7 70.6 0 19.1-8.7 36.4-22.6 49.1L736.8 617.7zM330.2 205.5l539-37.9v76l-498.8 35.1-40.2-37.2v-36zM165.2 857c-44 0-79.7-31.7-79.7-70.6 0-39 35.8-70.6 79.7-70.6 44 0 79.8 31.7 79.8 70.6-0.1 39-35.9 70.6-79.8 70.6z m704.1-528v205.5c-23.7-12.5-50.7-20.3-79.7-20.3-45.1 0-86 17.3-115.8 45L456.3 358.1l413-29.1z"/></svg>
        </button>
        <button class="control-btn minimize" aria-label="最小化" title="最小化">
          <svg>
            <use xlink:href="./icons/sprites.svg#icon-minus" />
          </svg>
        </button>
        <button class="control-btn close" aria-label="关闭" title="关闭">
          <svg>
            <use xlink:href="./icons/sprites.svg#icon-close"></use>
          </svg>
        </button>
      </div>
    </div>

    <!-- 内容视口 -->
    <div class="screen-wrapper">
      <div class="screen" id="screen">
        <div class="screen-inner" id="screenInner">

          <!-- 空闲状态 -->
          <div id="idleView" style="display:flex;flex-direction:column;align-items:center;justify-content:center;">
            <div id="nowPlaying" class="now-playing" style="display:none;">
              <svg class="now-playing-icon" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg" width="16" height="16">
                <path d="M575.4 64h-74.5v633.5C385.1 644.7 249.3 715.3 226.8 820c-7.4 34.1 7.8 70.9 21.9 87.8 79.3 94.7 252.2 50.6 331.6-51.2 35.3-45.2 32.3-84.5 32.3-181.3V287.6c48.9 36.3 104 70.1 123.7 134.9 12.2 40.3-4.1 107.3-17.1 141.5-3.9 10.3-14.7 18.9-9.7 29.2 34.3 25.4 51.1-28.6 60.9-51.2 10.6-24.5 20.8-54.7 24.4-75.6C833.2 242.8 595.5 234.3 575.4 64" fill="currentColor" />
              </svg>
              <div class="now-playing-info">
                <div class="now-playing-title" id="nowPlayingTitle"></div>
                <div class="now-playing-artist" id="nowPlayingArtist"></div>
              </div>
            </div>
            <div class="idle-text" id="idleText"></div>
            <div id="walkGif" class="walk-gif"></div>
            <div id="roadLayer" class="road-layer"></div>
          </div>

          <!-- 开场剧情（首次进入） -->
          <div id="introView" style="display:none;"></div>

          <div id="pokedexView" style="display:none;flex-direction:column;">
            <div class="pokedex-progress" id="pokedexProgress"></div>
            <div class="pokedex-search">
              <div class="pokedex-search-row">
                <div class="pokedex-search-input-wrap">
                  <input id="pokedexSearchInput" class="pokedex-search-input" type="text" placeholder="名称 / 拼音 / 首字母"
                    autocomplete="off" />
                  <button class="pokedex-search-clear" id="pokedexSearchClear" style="display:none;" aria-label="清空搜索">
                    <svg>
                      <use xlink:href="./icons/sprites.svg#icon-close" />
                    </svg>
                  </button>
                </div>
                <div id="pokedexRegionFilter" class="pokedex-region-select" tabindex="0">
                  <span id="pokedexRegionLabel">全部地区</span>
                  <svg class="region-arrow" viewBox="0 0 8 6" width="8" height="6">
                    <path d="M0,1 L4,5 L8,1" stroke="currentColor" fill="none" stroke-width="1.2" />
                  </svg>
                  <div id="pokedexRegionDropdown" class="region-dropdown" style="display:none;"></div>
                </div>
              </div>
              <div id="pokedexSearchDropdown" class="pokedex-dropdown" style="display:none;"></div>
            </div>
            <div class="pokedex-header">
              <span class="pokedex-star"></span>
              <span class="pokedex-idx" data-sort="index">#</span>
              <span class="pokedex-name" data-sort="name">名称</span>
              <span class="pokedex-stat" data-sort="seen">遇</span>
              <span class="pokedex-stat" data-sort="caught">捕</span>
              <span class="pokedex-stat" data-sort="shinySeen">闪遇</span>
              <span class="pokedex-stat" data-sort="shinyCaught">闪捕</span>
            </div>
            <div id="pokedexList" class="list-scroll"></div>
          </div>

          <!-- 手机主页（主菜单） -->
          <div id="phoneView" style="display:none;flex-direction:column;overflow:hidden;padding:6px 14px 8px;">
            <div id="phoneClock" class="phone-clock">
              <div id="phoneClockDate" class="date"></div>
              <div id="phoneClockTime" class="time"></div>
            </div>
            <div id="phoneMusic" class="phone-music" style="display:none;">
              <span class="eq" id="phoneMusicEq"><i></i><i></i><i></i></span>
              <span class="phone-music-title" id="phoneMusicTitleWrap"><span id="phoneMusicTitle"></span></span>
            </div>
            <div id="phoneContent" style="flex:1;color:var(--ui-color);"></div>
          </div>

          <!-- 对战（NPC 挑战） -->
          <div id="battleView" style="display:none;flex-direction:column;overflow:hidden;">
            <div id="battleContent" style="flex:1;color:var(--ui-color);min-height:0;"></div>
          </div>

          <!-- 配队 -->
          <div id="teamView" style="display:none;flex-direction:column;overflow:hidden;">
            <div id="teamContent" style="flex:1;color:var(--ui-color);min-height:0;"></div>
          </div>

          <!-- 宝可梦训练 -->
          <div id="trainView" style="display:none;flex-direction:column;overflow:hidden;">
            <div id="trainContent" style="flex:1;color:var(--ui-color);min-height:0;"></div>
          </div>

          <!-- 饲育屋 -->
          <div id="nurseryView" style="display:none;flex-direction:column;overflow:hidden;">
            <div id="nurseryContent" style="flex:1;color:var(--ui-color);min-height:0;"></div>
          </div>

          <!-- 游戏厅（首页场景） -->
          <div id="casinoView" style="display:none;flex-direction:column;overflow:hidden;">
            <div id="casinoContent" style="flex:1;display:flex;flex-direction:column;color:var(--ui-color);min-height:0;"></div>
          </div>

          <!-- 21 点（独立页） -->
          <div id="casinoGameView" style="display:none;flex-direction:column;overflow:hidden;">
            <div id="casinoGameContent" style="flex:1;display:flex;flex-direction:column;color:var(--ui-color);min-height:0;"></div>
          </div>

          <!-- 口袋麻将（独立页） -->
          <div id="mahjongView" style="display:none;flex-direction:column;overflow:hidden;">
            <div id="mahjongContent" style="flex:1;display:flex;flex-direction:column;color:var(--ui-color);min-height:0;"></div>
          </div>

          <!-- 抽卡机（gacha） -->
          <div id="gachaView" style="display:none;flex-direction:column;overflow:hidden;padding:0;">
            <div id="gachaContent" style="flex:1;display:flex;flex-direction:column;color:var(--ui-color);min-height:0;"></div>
          </div>

          <!-- 抽卡记录 -->
          <div id="gachaHistoryView" style="display:none;flex-direction:column;overflow-y:auto;padding:4px 6px;align-self:stretch;">
            <div id="gachaHistoryContent" style="flex:1;color:var(--ui-color);"></div>
          </div>

          <!-- 卡册 -->
          <div id="albumView" style="display:none;flex-direction:column;overflow:hidden;padding:0;">
            <div id="albumContent" style="flex:1;display:flex;flex-direction:column;color:var(--ui-color);min-height:0;"></div>
          </div>

          <!-- GPS 模拟导航 -->
          <div id="gpsView" style="display:none;flex-direction:column;overflow-y:auto;">
            <div id="gpsContent" style="flex:1;color:var(--ui-color);"></div>
          </div>

          <!-- 地区悬赏 -->
          <div id="bountyView"
            style="display:none;flex-direction:column;overflow:hidden;padding:4px 3px;position:relative;">
            <div id="bountyContent" style="flex:1;color:var(--ui-color);overflow-y:auto;"></div>
            <!-- 悬赏提示浮层：非当前地区点「可提交」时提示前往对应地区（固定于页面右上角） -->
            <div id="bountyToast" class="bounty-toast"></div>
          </div>

          <!-- 数据统计 -->
          <div id="dataView" style="display:none;flex-direction:column;overflow-y:auto;padding:4px 3px;">
            <div id="dataContent" style="flex:1;color:var(--ui-color);line-height:1.8;"></div>
          </div>

          <!-- 成就 -->
          <div id="achievementView" style="display:none;flex-direction:column;overflow-y:auto;padding:4px 3px;">
            <div id="achievementContent" style="flex:1;color:var(--ui-color);"></div>
          </div>

          <!-- 商店 -->
          <div id="shopView" style="display:none;flex-direction:column;overflow:hidden;padding:4px 3px;">
            <div id="shopContent" style="flex:1;color:var(--ui-color);overflow-y:auto;"></div>
            <!-- 兑换确认文案框（类似遇敌页文字框：先记录本次兑换，点"确定"才结算） -->
            <div id="shopTextBox" class="text-box shop-text-box" style="display:none;">
              <div id="shopTextBoxContent" class="text-box-content"></div>
              <div class="shop-confirm-btns">
                <span id="shopConfirmYes" class="catch-confirm-btn">确定</span>
                <span id="shopConfirmNo" class="catch-confirm-btn">取消</span>
              </div>
            </div>
          </div>

          <!-- 设置 -->
          <div id="settingsView" style="display:none;flex-direction:column;overflow-y:auto;padding:4px 3px;">
            <div id="settingsContent" style="flex:1;color:var(--ui-color);"></div>
          </div>

          <!-- 教程 -->
          <div id="tutorialView" style="display:none;">
            <div id="tutorialList"></div>
            <div id="tutorialContent"></div>
          </div>

          <!-- 版权声明 -->
          <div id="declarationView" style="display:none;flex-direction:column;overflow-y:auto;padding:6px 8px;">
            <div id="declarationContent" style="flex:1;color:var(--ui-color);"></div>
          </div>

          <!-- 系统日志 -->
          <div id="systemLogView" style="display:none;flex-direction:column;overflow-y:auto;">
            <div id="systemLogContent" style="flex:1;color:var(--ui-color);padding:3px 6px;"></div>
          </div>

          <!-- 遇敌状态 -->
          <div id="encounterView" style="display:none;">
            <div class="encounter-name" id="encounterName"></div>
            <div class="encounter-types" id="encounterTypes"></div>
            <div class="encounter-right">
              <span id="encounterOwnedWrap" class="encounter-owned-wrap" style="display:none;">
                <svg id="encounterOwnedIcon" class="encounter-owned" viewBox="0 0 1024 1024" width="18" height="18">
                  <use xlink:href="./icons/sprites.svg#icon-owned" />
                </svg>
                <span class="encounter-tooltip" id="encounterOwnedTip"></span>
              </span>
              <div id="encounterCatchRate" class="encounter-catch-rate"></div>
              <div id="encounterNewLabel" class="encounter-new-label" style="display:none;">新发现！</div>
            </div>
            <img id="encounterGif" class="encounter-gif" src="" alt="" />
            <!-- 丢球角色（左下角，始终显示，不被文字框遮住） -->
            <div id="animThrowChar" class="anim-throw-char">
              <img src="./character/brendan-back.png" class="anim-throw-char-img" alt="" />
            </div>
            <!-- 捕捉动画舞台 -->
            <div class="catch-stage" id="catchStage">
              <img id="animBall" class="anim-ball" src="./items/poke-ball.png" alt="精灵球" />
              <div id="animStars"
                style="position:absolute;left:0;top:0;right:0;bottom:0;pointer-events:none;z-index:4;"></div>
              <div id="animMsg" class="catch-msg"></div>
            </div>
          </div>

          <!-- 孵蛋动画（独立页面：与遇敌页解耦，返回回孵蛋器） -->
          <div id="hatchView" style="display:none;">
            <div class="encounter-name" id="hatchName"></div>
            <div class="encounter-types" id="hatchTypes"></div>
            <div class="encounter-right">
              <span id="hatchOwnedWrap" class="encounter-owned-wrap" style="display:none;">
                <svg id="hatchOwnedIcon" class="encounter-owned" viewBox="0 0 1024 1024" width="18" height="18">
                  <use xlink:href="./icons/sprites.svg#icon-owned" />
                </svg>
                <span class="encounter-tooltip" id="hatchOwnedTip"></span>
              </span>
              <div id="hatchCatchRate" class="encounter-catch-rate"></div>
              <div id="hatchNewLabel" class="encounter-new-label" style="display:none;">新发现！</div>
            </div>
            <img id="hatchGif" class="encounter-gif" src="" alt="" />
          </div>

          <!-- 关闭二次确认（右上角叉 / 任务栏关闭时弹出） -->
          <div id="quitDialog" class="dialog">
            <div class="dialog-box">
              <button class="quit-close" id="quitClose" aria-label="关闭">
                <svg><use xlink:href="./icons/sprites.svg#icon-close" /></svg>
              </button>
              <div class="dialog-title">关闭口袋挂机</div>
              <div class="dialog-opt" id="quitHide">最小化到托盘</div>
              <div class="dialog-opt" id="quitExit">退出游戏</div>
            </div>
          </div>

          <!-- 捕捉成功（仅蛋孵化用） -->
          <div id="caughtView" style="display:none;">
            <div id="caughtInfo"
              style="font-family:'Courier New',monospace;font-size:11px;color:var(--ui-color);font-weight:700;"></div>
          </div>

          <!-- 孵蛋器页面 -->
          <div id="incubatorView"
            style="display:none;flex-direction:column;overflow-y:auto;padding:4px 3px;width:100%;height:100%;">
            <div class="incubator-head" id="incubatorHead">
              <span></span>
              <button class="incubator-log-btn" id="incubatorLogBtn">孵蛋记录</button>
            </div>
            <div id="incubatorList"
              style="flex:1;color:var(--ui-color);display:grid;grid-template-columns:1fr 1fr;gap:5px;align-content:start;">
            </div>
          </div>

          <!-- 放入蛋页面 -->
          <div id="incubatorEggView" style="display:none;flex-direction:column;overflow:hidden;align-self:stretch;height:100%;color:var(--ui-color);"></div>

          <!-- 宝可梦仓库 -->
          <div id="rosterView" style="display:none;flex-direction:column;position:relative;">
            <div class="pokedex-progress" id="rosterProgress"></div>
            <div class="pokedex-search">
              <div class="pokedex-search-row">
                <div class="pokedex-search-input-wrap">
                  <input id="rosterSearchInput" class="pokedex-search-input" type="text" placeholder="名称 / 拼音 / 首字母"
                    autocomplete="off" />
                  <button class="pokedex-search-clear" id="rosterSearchClear" style="display:none;" aria-label="清空搜索">
                    <svg>
                      <use xlink:href="./icons/sprites.svg#icon-close" />
                    </svg>
                  </button>
                </div>
                <div id="rosterFilter" class="pokedex-region-select" tabindex="0">
                  <span id="rosterFilterLabel">全部</span>
                  <svg class="region-arrow" viewBox="0 0 8 6" width="8" height="6">
                    <path d="M0,1 L4,5 L8,1" stroke="currentColor" fill="none" stroke-width="1.2" />
                  </svg>
                  <div id="rosterFilterDropdown" class="region-dropdown" style="display:none;"></div>
                </div>
                <div id="rosterTypeFilter" class="pokedex-region-select" tabindex="0" title="按属性筛选">
                  <span id="rosterTypeFilterLabel">属性</span>
                  <svg class="region-arrow" viewBox="0 0 8 6" width="8" height="6">
                    <path d="M0,1 L4,5 L8,1" stroke="currentColor" fill="none" stroke-width="1.2" />
                  </svg>
                  <div id="rosterTypeFilterDropdown" class="region-dropdown" style="display:none;"></div>
                </div>
              </div>
            </div>
            <div class="pokedex-header roster-header">
              <span class="roster-icon"></span>
              <span class="pokedex-star"></span>
              <span class="pokedex-idx" data-sort="index">#</span>
              <span class="pokedex-name" data-sort="name">名称</span>
              <span class="roster-lv-col" data-sort="level">等级</span>
              <span class="roster-iv" data-sort="iv">个体值</span>
            </div>
            <div id="rosterList" class="list-scroll"></div>
          </div>

          <!-- 手动配招独立页面 -->
          <div id="moveEditView" style="display:none;flex-direction:column;overflow:hidden;position:relative;">
            <div id="moveEditContent" style="flex:1;min-height:0;display:flex;flex-direction:column;"></div>
          </div>

          <!-- 交换（宝可梦交换） -->
          <div id="tradeView" style="display:none;flex-direction:column;overflow:hidden;">
            <div id="tradeContent" style="flex:1;color:var(--ui-color);"></div>
          </div>

          <!-- 混合器页面（小游戏，无滚动条） -->
          <div id="mixerView" style="display:none;flex-direction:column;overflow:hidden;padding:0;">
            <div id="mixerContent" style="flex:1;color:var(--ui-color);"></div>
          </div>

          <!-- 农场-->
          <div id="berryView" style="display:none;flex-direction:column;overflow:hidden;position:relative;">
            <div id="berryContent" style="flex:1;display:flex;flex-direction:column;color:var(--ui-color);"></div>
          </div>

          <!-- 放生/提交告别场景（全屏独立场景，底部文字框询问确认） -->
          <div id="goodbyeView">
            <img class="goodbye-scene-img" alt="" />
            <!-- 交换获得：右上角精简信息（已捕获图标/新发现/稀有度），复用遇敌页样式 -->
            <div class="encounter-right" id="goodbyeRight" style="display:none;">
              <span class="encounter-owned-wrap" style="display:none;">
                <svg class="encounter-owned" viewBox="0 0 1024 1024" width="18" height="18">
                  <use xlink:href="./icons/sprites.svg#icon-owned" />
                </svg>
                <span class="encounter-tooltip"></span>
              </span>
              <div class="encounter-catch-rate"></div>
              <div class="encounter-new-label">新发现！</div>
            </div>
            <div class="goodbye-box">
              <div class="goodbye-box-text"></div>
              <div class="goodbye-box-arrow" data-goodbye-arrow style="display:none;">
                <svg viewBox="0 0 12 8" width="14" height="10">
                  <path d="M1,2 L11,2 L6,8 Z" fill="#306230" />
                </svg>
              </div>
              <div class="goodbye-box-btns">
                <span class="catch-confirm-btn" data-goodbye-ok>确定</span>
                <span class="catch-confirm-btn" data-goodbye-cancel>取消</span>
              </div>
            </div>
          </div>

        </div>

        <div id="textBox" class="text-box" style="transform:translateY(100%);">
          <div id="textBoxContent" class="text-box-content"></div>
          <div id="textBoxArrow" class="text-box-arrow" style="display:none;">
            <svg viewBox="0 0 12 8" width="14" height="10">
              <path d="M1,2 L11,2 L6,8 Z" fill="#306230" />
            </svg>
          </div>
          <div id="catchConfirmBtns" class="catch-confirm-btns" style="display:none;">
            <span id="confirmYes" class="catch-confirm-btn">确定</span>
            <span id="confirmNo" class="catch-confirm-btn">取消</span>
          </div>
          <div id="fleeBtn" class="flee-btn" style="display:none;">逃跑</div>
        </div>

        <!-- 启动画面-->
        <div id="splash">
          <div class="splash-inner">
            <div class="splash-title">口袋挂机</div>
            <div class="splash-subtitle">POKEMON IDLE</div>
            <div class="splash-stage">
              <img class="splash-hero" src="./character/brendan-front.png" alt="" />
              <div class="splash-ring" id="splashRing">
                <img class="splash-item" style="--i:0" src="./items/poke-ball.png" alt="" />
                <img class="splash-item" style="--i:1" src="./items/ultra-ball.png" alt="" />
                <img class="splash-item" style="--i:2" src="./items/master-ball.png" alt="" />
                <img class="splash-item" style="--i:3" src="./items/mystery-egg.png" alt="" />
                <img class="splash-item" style="--i:4" src="./items/honey.png" alt="" />
                <img class="splash-item" style="--i:5" src="./items/shiny-charm.png" alt="" />
                <img class="splash-item splash-item--sm" style="--i:6" src="./items/candy.png" alt="" />
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- 背包（可翻页：第一页常规道具，第二页自行车等） -->
    <div class="backpack-bar">
      <!-- 页码指示条：左/右长段为边框色，中间两短段亮起表示当前在第几页 -->
      <div class="bag-page-indicator" id="bagPageIndicator">
        <span class="seg-long"></span>
        <span class="seg-page on" data-page="1"></span>
        <span class="seg-page" data-page="2"></span>
        <span class="seg-long"></span>
      </div>
      <div class="backpack-items" id="backpack">
        <div id="bagPage1" class="bag-page">
          <div class="bag-slot" data-item="poke-ball">
            <img src="./items/poke-ball.png" class="bag-icon" alt="精灵球" />
            <span class="bag-name">精灵球</span>
            <span class="bag-qty" id="bag-poke-ball">0</span>
          </div>
          <div class="bag-slot" data-item="ultra-ball">
            <img src="./items/ultra-ball.png" class="bag-icon" alt="高级球" />
            <span class="bag-name">高级球</span>
            <span class="bag-qty" id="bag-ultra-ball">0</span>
          </div>
          <div class="bag-slot" data-item="master-ball">
            <img src="./items/master-ball.png" class="bag-icon" alt="大师球" />
            <span class="bag-name">大师球</span>
            <span class="bag-qty" id="bag-master-ball">0</span>
          </div>
          <div class="bag-slot" data-item="mystery-egg">
            <img src="./items/mystery-egg.png" class="bag-icon" alt="神秘蛋" />
            <span class="bag-name">神秘蛋</span>
            <span class="bag-qty" id="bag-mystery-egg">0</span>
          </div>
          <div class="bag-slot" data-item="sweet-honey">
            <img src="./items/honey.png" class="bag-icon" alt="甜甜蜜" />
            <span class="bag-name">甜甜蜜</span>
            <span class="bag-qty" id="bag-sweet-honey">0</span>
          </div>
          <div class="bag-slot" data-item="shiny-charm">
            <img src="./items/shiny-charm.png" class="bag-icon" alt="闪耀护符" />
            <span class="bag-name">闪耀护符</span>
            <span class="bag-qty" id="bag-shiny-charm">0</span>
          </div>
        </div>
        <div id="bagPage2" class="bag-page" style="display:none;">
          <div class="bag-slot" data-item="bike">
            <img src="./items/bike.png" class="bag-icon" alt="自行车" />
            <span class="bag-name">自行车</span>
            <span class="bag-qty" id="bag-bike">0</span>
          </div>
          <div class="bag-slot bag-slot--empty" aria-hidden="true"></div>
          <div class="bag-slot bag-slot--empty" aria-hidden="true"></div>
          <div class="bag-slot bag-slot--empty" aria-hidden="true"></div>
          <div class="bag-slot bag-slot--empty" aria-hidden="true"></div>
          <div class="bag-slot bag-slot--empty" aria-hidden="true"></div>
        </div>
      </div>
      <div class="stats-bar">
        <span id="statProgress"><img src="./items/candy.png"
            style="width:14px;height:14px;vertical-align:middle;image-rendering:pixelated;" /> 0</span>
        <span id="statDropHint" class="stat-drop-hint" style="display:none;"></span>
        <span id="statAutoStatus" class="stat-auto-status"><span id="statAutoText"></span><span
            class="stat-auto-bar-wrap"><span id="statAutoBar" class="stat-auto-bar-fill"></span></span></span>
        <span id="statTime">丰缘</span>
      </div>
    </div>
  </div>
</body>

</html>
