<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>进化指南</title>
<style>
  :root { --ink:#24563f; --ink2:#3e8a68; --bg:#f4f1e8; --card:#fffdf6; --line:#d8d2c2; --soft:#f7f3e6; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.6 "PingFang SC","Microsoft YaHei",system-ui,sans-serif; }
  header { position:sticky; top:0; z-index:20; padding:14px 24px 10px; border-bottom:2px solid var(--ink); background:var(--card); }
  /* 主体收窄居中，两侧留白；顶栏内容也跟着对齐同一条轴线 */
  header > .hrow, header > .searchwrap, header > .stats { max-width:920px; margin-left:auto; margin-right:auto; }
  .hrow { display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; }
  h1 { margin:0; font-size:20px; letter-spacing:1px; }
  .sub { opacity:.7; font-size:12.5px; }
  .stats { margin-top:8px; display:flex; flex-wrap:wrap; gap:16px; font-size:12.5px; opacity:.85; }
  .stats b { font-size:15px; }
  .searchwrap { margin-top:10px; display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  input[type=search] { padding:9px 12px; border:2px solid var(--line); border-radius:10px; font:inherit; min-width:300px; background:#fff; color:var(--ink); }
  input[type=search]:focus { outline:none; border-color:var(--ink2); }
  .hint { font-size:12.5px; opacity:.65; }
  main { padding:18px 24px 60px; max-width:920px; margin:0 auto; }
  section { margin-bottom:26px; }
  .tag { display:inline-block; padding:1px 8px; border-radius:10px; font-size:12px; color:#fff; white-space:nowrap; }
  .toolbar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:0 0 10px; }
  .chip { padding:3px 10px; border:1px solid var(--line); border-radius:12px; background:#fff; cursor:pointer; font-size:12px; user-select:none; }
  .chip.on { background:var(--ink2); border-color:var(--ink2); color:#fff; }

  /* 家族视图：一条进化 = 一对 */
  .fam { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 14px 14px; margin-bottom:12px; }
  .fam-head { display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; border-bottom:1px dashed var(--line); padding-bottom:8px; margin-bottom:10px; }
  .fam-head .t { font-weight:700; font-size:15px; }
  .fam-head .m { font-size:12.5px; opacity:.65; }
  .pairs { display:flex; flex-direction:column; gap:6px; }
  /* 三列：左边一只、中间条件、右边一只。左右列定宽，几行的头像就能竖着对齐 */
  .pair { display:grid; grid-template-columns:minmax(180px,220px) minmax(240px,1fr) minmax(180px,220px); gap:14px; align-items:center; background:#fff; border:1px solid var(--line); border-radius:10px; padding:5px 10px; }
  @media (max-width:820px) { .pair { grid-template-columns:1fr; gap:4px; } .pedge { justify-content:flex-start; } }
  .pnode { display:inline-flex; align-items:center; gap:6px; cursor:pointer; }
  .pnode img { width:32px; height:32px; object-fit:contain; image-rendering:pixelated; }
  .pnode .nm { font-weight:600; }
  .pnode .idx { opacity:.5; font-size:12px; margin-left:2px; }
  .pnode .badge { font-size:11px; opacity:.6; border:1px solid var(--line); border-radius:8px; padding:0 5px; }
  .pnode.hit { background:#f2faf5; box-shadow:0 0 0 2px rgba(62,138,104,.22); border-radius:8px; padding:0 6px; }
  .pedge { display:flex; align-items:center; justify-content:center; gap:5px; flex-wrap:wrap; }
  .cond { display:inline-flex; align-items:center; gap:4px; background:var(--soft); border:1px solid var(--line); border-radius:10px; padding:1px 8px; font-size:12.5px; }
  .cond img.it-s { width:15px; height:15px; object-fit:contain; }
  .subhead { margin:12px 0 6px; font-size:13px; font-weight:700; opacity:.8; border-top:1px dashed var(--line); padding-top:10px; }
  .empty { background:var(--card); border:1px dashed var(--line); border-radius:12px; padding:24px; text-align:center; opacity:.7; }

  /* 列表 */
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(330px,1fr)); gap:8px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:8px 10px; display:flex; gap:10px; align-items:center; }
  .card.none { opacity:.55; }
  .card img.mon { width:40px; height:40px; object-fit:contain; image-rendering:pixelated; flex-shrink:0; }
  .card .mon-name { cursor:pointer; }
  .card .mon-name:hover { color:var(--ink2); }
  .card img.it { width:24px; height:24px; object-fit:contain; vertical-align:middle; }
  .evo-line img.it-s { width:15px; height:15px; object-fit:contain; vertical-align:-2px; margin-right:2px; }
  .mon-name { font-weight:700; }
  .idx { opacity:.5; font-size:12px; margin-left:4px; }
  .evo-line { display:flex; align-items:center; flex-wrap:wrap; gap:4px; font-size:13px; }
</style>
</head>
<body>
<header>
  <div class="hrow">
    <h1>进化指南</h1>
    <span class="sub">搜一只宝可梦，直接展开它整条家族链；空着搜索框就是全图鉴列表。</span>
  </div>
  <div class="searchwrap">
    <input type="search" id="q" placeholder="搜索名字 / 编号，例如 伊布、皮卡丘、0133" autocomplete="off" />
    <span class="hint" id="hint"></span>
  </div>
  <div class="stats">
    <span>图鉴本体 <b>1057</b></span>
    <span>有进化 <b>485</b></span>
    <span>进化关系 <b>533</b> 对</span>
    <span>家族 <b>541</b> 个</span>
    <span>强化形态 <b>129</b></span>
  </div>
</header>
<main>

  <section>
    <div class="toolbar" id="browseTools">
      <span class="chip" data-f="all">全部</span>
      <span class="chip" data-f="evo">只看能进化</span>
      <span class="chip" data-f="none">只看无进化</span>
      <span id="kindChips"></span>
      <span class="hint" id="count"></span>
    </div>
    <div id="familyView"></div>
    <div class="grid" id="list"></div>
  </section>

</main>

g"}],"0998":[{"index":"0998-1","baseIdx":"0998","fromIdx":"0998","base":"戟脊龙","baseIcon":"../src/pokemon-data/icon/0998-戟脊龙.png","form":"超级戟脊龙","formIcon":"../src/pokemon-data/icon/0998-1-超级戟脊龙.png","item":"戟脊龙进化石","icon":"../src/items/evo/stones/baxcalibur-stone.png"}],"0383":[{"index":"0383-1","baseIdx":"0383","fromIdx":"0383","base":"固拉多","baseIcon":"../src/pokemon-data/icon/0383-固拉多.png","form":"原始固拉多","formIcon":"../src/pokemon-data/icon/0383-1-原始固拉多.png","item":"朱红色宝珠","icon":"../src/items/evo/stones/red-orb.png"}],"0382":[{"index":"0382-1","baseIdx":"0382","fromIdx":"0382","base":"盖欧卡","baseIcon":"../src/pokemon-data/icon/0382-盖欧卡.png","form":"原始盖欧卡","formIcon":"../src/pokemon-data/icon/0382-1-原始盖欧卡.png","item":"靛蓝色宝珠","icon":"../src/items/evo/stones/blue-orb.png"}],"0800":[{"index":"0800-1","baseIdx":"0800","fromIdx":"0800","base":"奈克洛兹玛-通常形态","baseIcon":"../src/pokemon-data/icon/0800-奈克洛兹玛-通常形态.png","form":"奈克洛兹玛-黄昏之鬃","formIcon":"../src/pokemon-data/icon/0800-1-奈克洛兹玛-黄昏之鬃.png","item":"奈克洛索尔合体器","icon":"../src/items/evo/stones/n-solarizer.png"},{"index":"0800-2","baseIdx":"0800","fromIdx":"0800","base":"奈克洛兹玛-通常形态","baseIcon":"../src/pokemon-data/icon/0800-奈克洛兹玛-通常形态.png","form":"奈克洛兹玛-拂晓之翼","formIcon":"../src/pokemon-data/icon/0800-2-奈克洛兹玛-拂晓之翼.png","item":"奈克洛露奈合体器","icon":"../src/items/evo/stones/n-lunarizer.png"},{"index":"0800-3","baseIdx":"0800","fromIdx":"0800","base":"奈克洛兹玛-通常形态","baseIcon":"../src/pokemon-data/icon/0800-奈克洛兹玛-通常形态.png","form":"究极奈克洛兹玛","formIcon":"../src/pokemon-data/icon/0800-3-究极奈克洛兹玛.png","item":"究极奈克洛Ｚ","icon":"../src/items/evo/stones/ultranecrozium-z.png"}],"0646":[{"index":"0646-1","baseIdx":"0646","fromIdx":"0646","base":"酋雷姆","baseIcon":"../src/pokemon-data/icon/0646-酋雷姆.png","form":"酋雷姆-白","formIcon":"../src/pokemon-data/icon/0646-1-酋雷姆-白.png","item":"基因之楔","icon":"../src/items/evo/stones/dna-splicer.png"},{"index":"0646-2","baseIdx":"0646","fromIdx":"0646","base":"酋雷姆","baseIcon":"../src/pokemon-data/icon/0646-酋雷姆.png","form":"酋雷姆-黑","formIcon":"../src/pokemon-data/icon/0646-2-酋雷姆-黑.png","item":"基因之楔","icon":"../src/items/evo/stones/dna-splicer.png"}],"0888":[{"index":"0888-1","baseIdx":"0888","fromIdx":"0888","base":"苍响-百战勇者","baseIcon":"../src/pokemon-data/icon/0888-苍响-百战勇者.png","form":"苍响-剑之王","formIcon":"../src/pokemon-data/icon/0888-1-苍响-剑之王.png","item":"腐朽的剑","icon":"../src/items/evo/stones/rusted-sword.png"}],"0889":[{"index":"0889-1","baseIdx":"0889","fromIdx":"0889","base":"藏玛然特-百战勇者","baseIcon":"../src/pokemon-data/icon/0889-藏玛然特-百战勇者.png","form":"藏玛然特-盾之王","formIcon":"../src/pokemon-data/icon/0889-1-藏玛然特-盾之王.png","item":"腐朽的盾","icon":"../src/items/evo/stones/rusted-shield.png"}],"0898":[{"index":"0898-1","baseIdx":"0898","fromIdx":"0898","base":"蕾冠王","baseIcon":"../src/pokemon-data/icon/0898-蕾冠王.png","form":"蕾冠王-骑白马","formIcon":"../src/pokemon-data/icon/0898-1-蕾冠王-骑白马.png","item":"牵绊缰绳","icon":"../src/items/evo/stones/reins-of-unity.png"},{"index":"0898-2","baseIdx":"0898","fromIdx":"0898","base":"蕾冠王","baseIcon":"../src/pokemon-data/icon/0898-蕾冠王.png","form":"蕾冠王-骑黑马","formIcon":"../src/pokemon-data/icon/0898-2-蕾冠王-骑黑马.png","item":"牵绊缰绳","icon":"../src/items/evo/stones/reins-of-unity.png"}],"0890":[{"index":"0890-1","baseIdx":"0890","fromIdx":"0890","base":"无极汰那","baseIcon":"../src/pokemon-data/icon/0890-无极汰那.png","form":"无极汰那-无极巨化","formIcon":"../src/pokemon-data/icon/0890-1-无极汰那-无极巨化.png","item":"无极核心","icon":"../src/items/evo/stones/max-core.png"}]}};
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
const kindTag = (k) => { const m = DATA.kinds[k] || { label: k, color: "#8a8a8a" }; return `<span class="tag" style="background:${m.color}">${m.label}</span>`; };

// ---------- "一对一行"的通用零件：左右两只宝可梦，中间夹条件或道具图标 ----------
// showIdx 只影响显示（强化形态的终点显示它自己的编号，不填就用 idx）；data-idx = 点了看哪一族
const beast = (name, icon, idx, hit, showIdx) => `<span class="pnode${hit ? ' hit' : ''}"${idx ? ` data-idx="${esc(idx)}"` : ''}><img src="${icon || ''}" alt="" loading="lazy" /><span class="nm">${esc(name)}</span><span class="idx">#${esc(showIdx || idx || '')}</span></span>`;
const pill = (html, icon) => `<span class="cond">${icon ? `<img class="it-s" src="${icon}" alt="" />` : ''}${html}</span>`;
// 一条进化的条件：几个条件就几枚格子（Lv25 / 日之石 分开），没拆分数据时退回整句
const condPills = (e) => (e.condHtmlParts || [e.condHtml || esc(e.cond)]).map((p) => pill(p)).join('');
const pairRow = (from, edge, to) => `<div class="pair">${from}<span class="pedge">${edge}</span>${to}</div>`;
// 强化形态那一对：本体 → 道具 → 强化形态（点击落到本体所在的家族）
const formPair = (x) => pairRow(beast(x.base, x.baseIcon, x.baseIdx), pill(esc(x.item), x.icon), beast(x.form, x.formIcon, x.baseIdx, false, x.index));

const kindChips = document.getElementById('kindChips');
kindChips.innerHTML = Object.entries(DATA.kinds).map(([k, m]) =>
  `<span class="chip" data-f="kind:${k}">${m.label}</span>`).join(' ') +
  ' <span class="chip" data-f="kind:region">地区</span>';   // 地区条件单独一项：只列出要在特定地区进化的

// ---------- 家族链视图 ----------
const byIdx = {};
const famOf = (idx) => (byIdx[idx] && byIdx[idx].family) || DATA.familyOf[idx] || idx;   // 形态没有 familyOf，用自带的 family
DATA.species.forEach((s) => { byIdx[s.idx] = s; });
const famGroups = {};
DATA.species.forEach((s) => { const f = DATA.familyOf[s.idx] || s.idx; (famGroups[f] = famGroups[f] || []).push(s.idx); });
// 没有进化的形态也进家族，排在自家本体后面
DATA.forms.forEach((s) => { byIdx[s.idx] = s; (famGroups[s.family] = famGroups[s.family] || []).push(s.idx); });
for (const g of Object.values(famGroups)) g.sort();

const labelOf = (idx) => { const s = byIdx[idx]; return s ? (s.form || s.name) : idx; };
// 地区条件就是一枚条件格：Lv36 + 神奥地区
const regionPill = (r) => `<span class="cond">${esc(r)}地区</span>`;
function familyHtml(famId, matchSet, withBack) {
  const members = famGroups[famId] || [];
  const shown = new Set();
  const rows = [];
  for (const idx of members) {
    const s = byIdx[idx];
    if (!s) continue;
    for (const e of s.evo) {
      const ts = byIdx[e.to];                       // 终点没进图鉴列表（如阿罗拉九尾）：用边自带的图和名
      const tname = ts ? labelOf(e.to) : e.toName;
      const ticon = ts ? ts.icon : e.toIcon;
      shown.add(idx); shown.add(e.to);
      rows.push(pairRow(
        beast(labelOf(idx), s.icon, idx, matchSet.has(idx)),
        condPills(e) + (e.regionNote ? regionPill(e.regionNote) : ''),   // 家族视图不挂通道标签，条件一格一条
        beast(tname, ticon, e.to, matchSet.has(e.to))
      ));
    }
  }
  for (const idx of members) {                      // 家族里没出现在任何一条关系里的（本身没有进化）
    if (shown.has(idx)) continue;
    const s = byIdx[idx];
    if (!s) continue;
    rows.push(pairRow(beast(labelOf(idx), s.icon, idx, matchSet.has(idx)), pill('无进化'), '<span></span>'));
  }
  // 强化形态同样是"一对"：本体 → 道具 → 强化形态
  const seenForm = new Set();
  const formRows = [];
  for (const idx of members) {
    for (const x of DATA.stonesByBase[idx] || []) {
      if (seenForm.has(x.form)) continue;
      seenForm.add(x.form);
      formRows.push(formPair(x));
    }
  }
  // 物种数把"只作为终点、自己不再进化"的形态也算进去，和下面列出的行数对得上
  const nodeCount = new Set(members);
  for (const i of members) for (const e of (byIdx[i] ? byIdx[i].evo : [])) nodeCount.add(e.to);
  const rootIdx = members.find((i) => !i.includes('-')) || members[0];
  const rootName = byIdx[rootIdx] ? byIdx[rootIdx].name : rootIdx;
  // 家族标题用根的名字；搜到的如果不是根，补一句"含 XX"，免得对不上号
  const matched = matchSet.has(rootIdx) ? [] : members.filter((i) => matchSet.has(i)).map((i) => labelOf(i));
  const sub = matched.length ? ` · 含 ${matched.slice(0, 2).join('、')}${matched.length > 2 ? ' 等' : ''}` : '';
  return `<div class="fam">
    <div class="fam-head"><span class="t">${esc(rootName)}家族</span>${withBack ? '<span class="chip" data-back>← 返回图鉴列表</span>' : ''}<span class="m">${nodeCount.size} 个物种 · ${rows.length} 条进化${formRows.length ? ` · ${formRows.length} 个强化形态` : ''}${esc(sub)}</span></div>
    <div class="pairs">${rows.join('')}${formRows.length ? `<div class="subhead">强化形态</div>${formRows.join('')}` : ''}</div>
  </div>`;
}
function cardHtml(s) {
  return `<div class="card ${s.evo.length ? '' : 'none'}">
      <img class="mon" loading="lazy" src="${s.icon}" alt="" />
      <div style="min-width:0">
        <div class="mon-name" data-idx="${esc(s.idx)}">${esc(s.form || s.name)}<span class="idx">#${s.idx}${s.legend ? ' · 神兽' : ''}</span></div>
        ${s.evo.length
          ? s.evo.map((e) => `<div class="evo-line">${e.kinds.map(kindTag).join('')}${condPills(e)}${e.regionNote ? regionPill(e.regionNote) : ''}
              <img class="it" loading="lazy" src="${e.toIcon}" alt="" /><span>${esc(e.toName)}</span></div>`).join('')
          : '<div style="font-size:12px;opacity:.6">无进化</div>'}
      </div>
    </div>`;
}

let filter = 'all';
const famView = document.getElementById('familyView');
const listEl = document.getElementById('list');
const toolsEl = document.getElementById('browseTools');
const qEl = document.getElementById('q');
let focusFamily = null;    // 点了某只之后先只看它那一族（不动搜索框），点「返回图鉴列表」或开始打字就回来
function render() {
  const raw = qEl.value.trim();
  const q = raw.toLowerCase();
  if (!q && focusFamily) {
    toolsEl.style.display = 'none';
    listEl.innerHTML = '';
    document.getElementById('hint').textContent = '';
    famView.innerHTML = familyHtml(focusFamily, new Set(), true);
    return;
  }
  if (q) {
    const hits = DATA.species.concat(DATA.forms).filter((s) => (s.form || s.name).toLowerCase().includes(q) || s.name.toLowerCase().includes(q) || s.idx.includes(q));
    const matchSet = new Set(hits.map((s) => s.idx));
    const famIds = [...new Set(hits.map((s) => famOf(s.idx)))];
    const exact = (s) => (s.form || s.name) === raw || s.name === raw;
    famIds.sort((a, b) => {
      const ha = (famGroups[a] || []).some((i) => matchSet.has(i) && byIdx[i] && exact(byIdx[i])) ? 0 : 1;
      const hb = (famGroups[b] || []).some((i) => matchSet.has(i) && byIdx[i] && exact(byIdx[i])) ? 0 : 1;
      return ha - hb || a.localeCompare(b);
    });
    toolsEl.style.display = 'none';
    listEl.innerHTML = '';
    if (!hits.length) {
      famView.innerHTML = `<div class="empty">没找到「${esc(raw)}」——试试名字，或 4 位编号（如 0133 伊布）</div>`;
      document.getElementById('hint').textContent = '';
    } else {
      famView.innerHTML = famIds.map((f) => familyHtml(f, matchSet)).join('');
      document.getElementById('hint').textContent = `命中 ${hits.length} 个物种，展开 ${famIds.length} 个家族`;
    }
    return;
  }
  document.getElementById('hint').textContent = '';
  toolsEl.style.display = '';
  famView.innerHTML = '';
  const list = DATA.species.filter((s) => {
    if (filter === 'evo' && !s.evo.length) return false;
    if (filter === 'none' && s.evo.length) return false;
    if (filter.startsWith('kind:')) {
      const k = filter.slice(5);
      const hit = k === 'region' ? s.evo.some((e) => e.regionNote) : s.evo.some((e) => e.kinds.includes(k));
      if (!hit) return false;
    }
    return true;
  }).sort((a, b) => (b.evo.length > 0) - (a.evo.length > 0) || a.idx.localeCompare(b.idx));
  listEl.innerHTML = list.map(cardHtml).join('');
  document.getElementById('count').textContent = `${list.length} 个物种`;
}
qEl.addEventListener('input', () => { focusFamily = null; render(); });
document.querySelectorAll('.chip').forEach((c) => c.addEventListener('click', () => {
  document.querySelectorAll('.chip').forEach((x) => x.classList.remove('on'));
  c.classList.add('on');
  filter = c.dataset.f;
  render();
}));
document.querySelector('.chip[data-f="all"]').classList.add('on');

document.addEventListener('click', (ev) => {
  if (ev.target.closest('[data-back]')) { focusFamily = null; render(); return; }
  const n = ev.target.closest('[data-idx]');
  if (n) { focusFamily = famOf(n.dataset.idx); render(); }
});
render();
</script>
