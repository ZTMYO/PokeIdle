<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>获取方式一览</title>
<style>
  :root { --ink:#24563f; --ink2:#3e8a68; --bg:#f4f1e8; --card:#fffdf6; --line:#d8d2c2; --soft:#f7f3e6; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.6 "PingFang SC","Microsoft YaHei",system-ui,sans-serif; }
  header { position:sticky; top:0; z-index:20; padding:14px 24px 10px; border-bottom:2px solid var(--ink); background:var(--card); }
  header > .hrow, header > .searchwrap, header > .stats, header > .toolbar { max-width:920px; margin-left:auto; margin-right:auto; }
  .hrow { display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; }
  h1 { margin:0; font-size:20px; letter-spacing:1px; }
  .sub { opacity:.7; font-size:12.5px; }
  .stats { margin-top:8px; display:flex; flex-wrap:wrap; gap:16px; font-size:12.5px; opacity:.85; }
  .stats b { font-size:15px; }
  .searchwrap { margin-top:10px; display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  input[type=search] { padding:9px 12px; border:2px solid var(--line); border-radius:10px; font:inherit; min-width:300px; background:#fff; color:var(--ink); }
  input[type=search]:focus { outline:none; border-color:var(--ink2); }
  .hint { font-size:12.5px; opacity:.65; }
  .toolbar { margin-top:8px; display:flex; flex-wrap:wrap; gap:6px; align-items:center; padding-bottom:10px; }
  .chip { padding:3px 10px; border:1px solid var(--line); border-radius:12px; background:#fff; cursor:pointer; font-size:12px; user-select:none; }
  .chip.on { background:var(--ink2); border-color:var(--ink2); color:#fff; }
  main { padding:16px 24px 60px; max-width:920px; margin:0 auto; }
  .grid { display:flex; flex-direction:column; gap:6px; }
  .row { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:8px 10px; display:flex; gap:10px; align-items:flex-start; }
  .row img.mon { width:40px; height:40px; object-fit:contain; image-rendering:pixelated; flex-shrink:0; }
  .row .body { min-width:0; flex:1; }
  .head { display:flex; align-items:baseline; gap:6px; flex-wrap:wrap; }
  .mon-name { font-weight:700; }
  .idx { opacity:.5; font-size:12px; }
  .badge { font-size:11px; opacity:.75; border:1px solid var(--line); border-radius:8px; padding:0 5px; }
  .badge.god { color:#b5722f; border-color:#e0c9a8; }
  .pills { display:flex; flex-wrap:wrap; gap:4px; margin-top:4px; }
  .pill { display:inline-flex; align-items:center; gap:4px; border:1px solid var(--line); border-radius:10px; padding:1px 7px; font-size:12px; background:var(--soft); }
  .pill b { font-weight:700; color:#fff; background:var(--c,#888); border-radius:8px; padding:0 6px; font-size:11px; }
  .pill img.it-s { width:14px; height:14px; object-fit:contain; vertical-align:-2px; }
  .empty { background:var(--card); border:1px dashed var(--line); border-radius:12px; padding:24px; text-align:center; opacity:.7; }
</style>
</head>
<body>
<header>
  <div class="hrow">

  </div>
  <div class="searchwrap">
    <input type="search" id="q" placeholder="搜索名字 / 编号 / 拼音 / 地区，例如 皮卡丘、0133、pkq、关都" autocomplete="off" />

    <span>无途径 <b>0</b></span>

  <div class="toolbar" id="chips"></div>
</header>
<main>

</main>

thor","s":""}]},{"i":"1023","n":"铁头壳","icon":"../src/pokemon-data/icon/1023-铁头壳.png","region":"帕底亚","legend":true,"py":"TIETOUKE","pi":"TTK","m":[{"t":"wild","s":"帕底亚"},{"t":"twist","s":""},{"t":"easter_author","s":""}]},{"i":"1024","n":"太乐巴戈斯-普通形态","icon":"../src/pokemon-data/icon/1024-太乐巴戈斯-普通形态.png","region":"帕底亚","legend":true,"py":"TAILEBAGESIPUTONGXINGTAI","pi":"TLBGSPTXT","m":[{"t":"wild","s":"帕底亚"},{"t":"twist","s":""},{"t":"easter_author","s":""}]},{"i":"1024-1","n":"太乐巴戈斯-太晶形态","icon":"../src/pokemon-data/icon/1024-1-太乐巴戈斯-太晶形态.png","region":"帕底亚","legend":true,"py":"TAILEBAGESITAIJINGXINGTAI","pi":"TLBGSTJXT","m":[{"t":"wild","s":"帕底亚"},{"t":"twist","s":""},{"t":"easter_author","s":""}]},{"i":"1024-2","n":"太乐巴戈斯-星星形态","icon":"../src/pokemon-data/icon/1024-2-太乐巴戈斯-星星形态.png","region":"帕底亚","legend":true,"py":"TAILEBAGESIXINGXINGXINGTAI","pi":"TLBGSXXXT","m":[{"t":"wild","s":"帕底亚"},{"t":"twist","s":""},{"t":"easter_author","s":""}]},{"i":"1025","n":"桃歹郎","icon":"../src/pokemon-data/icon/1025-桃歹郎.png","region":"帕底亚","legend":true,"py":"TAODAILANG","pi":"TDL","m":[{"t":"wild","s":"帕底亚"},{"t":"twist","s":""},{"t":"easter_author","s":""}]}]};
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
let typeFilter = 'all';
let query = '';

const chipsEl = document.getElementById('chips');
const counts = {};
for (const r of DATA.rows) for (const m of r.m) counts[m.t] = (counts[m.t] || 0) + 1;
chipsEl.innerHTML = ['all', ...DATA.order].map((t) => {
  const label = t === 'all' ? '全部' : DATA.types[t].label;
  const n = t === 'all' ? DATA.rows.length : (counts[t] || 0);
  return `<span class="chip${t === 'all' ? ' on' : ''}" data-t="${t}">${label} ${n}</span>`;
}).join('');
chipsEl.addEventListener('click', (e) => {
  const chip = e.target.closest('.chip');
  if (!chip) return;
  typeFilter = chip.dataset.t;
  chipsEl.querySelectorAll('.chip').forEach((c) => c.classList.toggle('on', c === chip));
  render();
});

function matches(r, q) {
  if (!q) return true;
  const u = q.toUpperCase();
  return r.n.includes(q) || r.i.includes(q) || (r.region && r.region.includes(q)) || (r.py && r.py.includes(u)) || (r.pi && r.pi.includes(u));
}

const pill = (m) => `<span class="pill" style="--c:${DATA.types[m.t].color}"><b>${DATA.types[m.t].label}</b>${m.s ? esc(m.s) : ''}</span>`;
const rowHtml = (r) => `<div class="row">
  <img class="mon" src="${r.icon}" alt="" loading="lazy" />
  <div class="body">
    <div class="head"><span class="mon-name">${esc(r.n)}</span><span class="idx">#${esc(r.i)}</span>${r.region ? `<span class="badge">${esc(r.region)}</span>` : ''}${r.legend ? '<span class="badge god">神兽/幻兽</span>' : ''}</div>
    <div class="pills">${r.m.map(pill).join('')}</div>
  </div>
</div>`;

const listEl = document.getElementById('list');
const hintEl = document.getElementById('hint');
function render() {
  const q = query.trim();
  const out = DATA.rows.filter((r) => (typeFilter === 'all' || r.m.some((m) => m.t === typeFilter)) && matches(r, q));
  listEl.innerHTML = out.length ? out.map(rowHtml).join('') : '<div class="empty">没找到——试试名字、4 位编号或拼音首字母</div>';
  hintEl.textContent = `匹配 ${out.length} / ${DATA.rows.length} 只`;
}
document.getElementById('q').addEventListener('input', (e) => { query = e.target.value.trim(); render(); });
render();
</script>
