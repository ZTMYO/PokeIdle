<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:,">
<title>地区地图</title>
<style>
  :root {
    --body: #e8dcc0;
    --panel: #dbcfb0;
    --bg: #d0c4a4;
    --screen: #73c5a4;
    --screen-dark: #4c8d73;
    --accent: #3a775e;
    --accent-light: #5a9a7e;
    --text: #1f1f1f;
    --text-muted: #7c7c7c;
    --border: #c4b692;
    --shadow: #b8a88a;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', monospace;
    background: var(--body);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    user-select: none;
    font-size: 13px;
  }

  /* === 标题栏 === */
  .title-bar {
    min-height: 36px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 4px 8px;
    padding: 4px 12px;
    background: var(--body);
    border-bottom: 2px solid var(--border);
    flex-shrink: 0;
  }

  .title-bar h1 {
    font-size: 15px;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: 1px;
  }

  .title-bar .info {
    margin-left: auto;
    font-size: 11px;
    color: var(--text-muted);
  }

  /* === 画布区 === */
  .screen-panel {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    min-height: 0;
  }

  .screen-panel svg {
    display: block;
    width: 100%;
    height: 100%;
  }

  svg text { user-select: none; }

  .edge-line { cursor: pointer; transition: opacity .15s; }
  .edge-line.hl { stroke-width: 4; opacity: 1; }
  .edge-line.dim { opacity: 0.12; }
</style>
</head>
<body>
  <div class="title-bar">
    <h1>地区地图</h1>
  </div>
  <div class="screen-panel">
    <svg id="map" width="1000" height="700" viewBox="0 0 1000 700" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',monospace"></svg>
  </div>
  <script>
    const REGIONS = ['关都', '城都', '丰缘', '神奥', '合众', '卡洛斯', '阿罗拉', '伽勒尔', '帕底亚'];
    const COLORS = ['#E3350D', '#F6C700', '#3DAE5B', '#4FC3F7', '#757575', '#F06292', '#FF9800', '#5C6BC0', '#AB47BC'];
    const LIGHT_NODES = [1, 3, 4, 5, 6];
    const POS = {
      0: [821, 299], 1: [762, 361], 2: [689, 484], 3: [845, 169],
      4: [165, 311], 5: [388, 202], 6: [424, 615], 7: [370, 85], 8: [365, 316],
    };
    const svg = document.getElementById('map');
    const NS = 'http://www.w3.org/2000/svg';
    const el = (tag, attrs) => {
      const n = document.createElementNS(NS, tag);
      for (const [k, v] of Object.entries(attrs || {})) n.setAttribute(k, v);
      return n;
    };

    const delaunay = (pts) => {
      const minX = Math.min(...pts.map(p => p[0])), maxX = Math.max(...pts.map(p => p[0]));
      const minY = Math.min(...pts.map(p => p[1])), maxY = Math.max(...pts.map(p => p[1]));
      const d = Math.max(maxX - minX, maxY - minY) * 20;
      const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;
      const sup = [[cx - d, cy - d], [cx + d, cy - d], [cx, cy + d]];
      const circum = (a, b, c) => {
        const ax = a[0], ay = a[1], bx = b[0], by = b[1], cx = c[0], cy = c[1];
        const D = 2 * (ax * (by - cy) + bx * (cy - ay) + cx * (ay - by));
        if (Math.abs(D) < 1e-9) return [Infinity, Infinity, Infinity];
        const a2 = ax * ax + ay * ay, b2 = bx * bx + by * by, c2 = cx * cx + cy * cy;
        const ux = (a2 * (by - cy) + b2 * (cy - ay) + c2 * (ay - by)) / D;
        const uy = (a2 * (cx - bx) + b2 * (ax - cx) + c2 * (bx - ax)) / D;
        return [ux, uy, (ux - ax) ** 2 + (uy - ay) ** 2];
      };
      let tris = [[sup[0], sup[1], sup[2]]];
      for (const p of pts) {
        const bad = tris.filter(t => {
          const [ux, uy, r2] = circum(t[0], t[1], t[2]);
          return (p[0] - ux) ** 2 + (p[1] - uy) ** 2 <= r2;
        });
        const poly = [];
        for (const t of bad) {
          for (let k = 0; k < 3; k++) {
            const e = [t[k], t[(k + 1) % 3]];
            const shared = bad.some(t2 => t2 !== t && t2.includes(e[0]) && t2.includes(e[1]));
            if (!shared) poly.push(e);
          }
        }
        tris = tris.filter(t => !bad.includes(t));
        for (const e of poly) tris.push([e[0], e[1], p]);
      }
      const edges = new Set();
      for (const t of tris) {
        if (t.some(v => sup.includes(v))) continue;
        for (let k = 0; k < 3; k++) {
          const a = pts.indexOf(t[k]), b = pts.indexOf(t[(k + 1) % 3]);
          if (a < b) edges.add(`${a}-${b}`);
        }
      }
      return [...edges].map(s => s.split('-').map(Number));
    };

    // 每条路拆成前后两段，各自独立编号：前半段归出发地区、后半段归目标地区
    // Delaunay 生成的丰缘-关都、城都-神奥 为原作水路/不直连，剔除不画；
    // 关都-神奥 为原作直连陆路（Delaunay 未生成），手动补上。
    const segments = [];
    let segNum = 1;
    const rawEdges = delaunay([0, 1, 2, 3, 4, 5, 6, 7, 8].map(i => POS[i]))
      .filter(([a, b]) => !(a === 0 && b === 2) && !(a === 1 && b === 3));
    if (!rawEdges.some(([a, b]) => a === 0 && b === 3)) rawEdges.push([0, 3]);
    for (const [a, b] of rawEdges) {
      const [ax, ay] = POS[a], [bx, by] = POS[b];
      const mx = (ax + bx) / 2, my = (ay + by) / 2;
      segments.push(
        { num: segNum++, a, b, from: a, half: 0,
          d: `M ${ax} ${ay} L ${mx} ${my}`,
          lx: ax + (mx - ax) * 0.5, ly: ay + (my - ay) * 0.5 },
        { num: segNum++, a, b, from: b, half: 1,
          d: `M ${mx} ${my} L ${bx} ${by}`,
          lx: mx + (bx - mx) * 0.5, ly: my + (by - my) * 0.5 }
      );
    }

    const edgeGroups = new Map();
    segments.forEach(s => {
      const path = el('path', {
        d: s.d, stroke: COLORS[s.from], 'stroke-width': 2.5, 'stroke-linecap': 'round',
        fill: 'none', opacity: 0.55, class: 'edge-line'
      });
      svg.appendChild(path);
      const t = el('text', {
        x: s.lx, y: s.ly + (s.half === 0 ? -11 : 18),
        'text-anchor': 'middle', 'font-size': 10, fill: '#2b3a45',
        style: 'paint-order:stroke;stroke:#d0c4a4;stroke-width:3px;'
      });
      t.textContent = `${s.num}#道路（${REGIONS[s.from]}）`;
      svg.appendChild(t);
      const key = `${Math.min(s.a, s.b)}-${Math.max(s.a, s.b)}`;
      if (!edgeGroups.has(key)) edgeGroups.set(key, { a: s.a, b: s.b, halves: [] });
      edgeGroups.get(key).halves.push({ path, label: t, from: s.from });
    });

    // 分界点（菱形，白边）
    const splits = [...new Set(segments.map(s => `${(POS[s.a][0] + POS[s.b][0]) / 2},${(POS[s.a][1] + POS[s.b][1]) / 2}`))];
    splits.forEach(k => {
      const [x, y] = k.split(',').map(Number);
      svg.appendChild(el('rect', {
        x: x - 4.5, y: y - 4.5, width: 9, height: 9,
        fill: '#fff', stroke: '#1f1f1f', 'stroke-width': 1.5, transform: `rotate(45 ${x} ${y})`
      }));
    });

    // 地区节点（实心圆 + 名称标签），整组可 hover
    const nodeGroupEls = [];
    REGIONS.forEach((name, i) => {
      const [x, y] = POS[i];
      const g = el('g', { style: 'cursor:pointer' });
      g.appendChild(el('circle', { cx: x, cy: y, r: 15, fill: COLORS[i], stroke: '#fff', 'stroke-width': 2 }));
      const n = el('text', {
        x: x, y: y + 4.5, 'text-anchor': 'middle', 'font-size': 11, 'font-weight': 700,
        fill: LIGHT_NODES.includes(i) ? '#1f1f1f' : '#fff'
      });
      n.textContent = String(i);
      g.appendChild(n);
      const l = el('text', {
        x: x + 24, y: y + 4.5, 'text-anchor': 'start', 'font-size': 12.5, 'font-weight': 700, fill: '#1f1f1f',
        style: 'paint-order:stroke;stroke:#d0c4a4;stroke-width:3px;'
      });
      l.textContent = name;
      g.appendChild(l);
      svg.appendChild(g);
      nodeGroupEls[i] = g;
    });

    // ---- 交互 ----
    // 清除所有高亮
    function clearHover() {
      edgeGroups.forEach(eg => {
        eg.halves.forEach(h => {
          h.path.classList.remove('hl');
          h.path.classList.remove('dim');
          h.label.setAttribute('font-weight', 400);
        });
      });
    }
    // hover 节点：加粗该地区名下的各半段路（相邻边中属于该地区的半段），其余半段变淡
    nodeGroupEls.forEach((g, i) => {
      g.addEventListener('mouseenter', () => {
        edgeGroups.forEach(eg => {
          eg.halves.forEach(h => {
            const hit = h.from === i; // 半段归属地区 = 被 hover 的地区
            h.path.classList.toggle('hl', hit);
            h.path.classList.toggle('dim', !hit);
            h.label.setAttribute('font-weight', hit ? 700 : 400);
          });
        });
      });
      g.addEventListener('mouseleave', clearHover);
    });
    // hover 半段边：只加粗该半段 + 该半段的路名
    edgeGroups.forEach(eg => {
      eg.halves.forEach(h => {
        h.path.addEventListener('mouseenter', () => {
          h.path.classList.add('hl');
          h.label.setAttribute('font-weight', 700);
        });
        h.path.addEventListener('mouseleave', clearHover);
      });
    });
  </script>
</body>
</html>
