<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>宝可梦标识</title>
<style>
  :root {
    color-scheme: dark;
    --icon: #73c5a4;
    --card: #376d56;
    --bg: #223f33;
    --line: rgba(115, 197, 164, .22);
    --text: #eef8f3;
    --muted: #b7d6c6;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 980px; margin: 0 auto; padding: 32px 20px 56px; }
  header { margin-bottom: 22px; }
  h1 { margin: 0 0 6px; font-size: 22px; letter-spacing: .02em; }
  .lede { margin: 0; font-size: 13px; line-height: 1.7; color: var(--muted); }
  .lede b { color: var(--text); font-weight: 600; }
  .group + .group { margin-top: 24px; }
  .group-title {
    margin: 0 0 10px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--line);
    font-size: 13px;
    font-weight: 600;
    letter-spacing: .06em;
    color: var(--muted);
  }
  .row { display: flex; flex-wrap: wrap; gap: 12px; }
  .badge {
    flex: 1 1 180px;
    max-width: 260px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    padding: 16px 12px 14px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--card);
    text-align: center;
  }
  .badge-icon { display: flex; align-items: center; justify-content: center; width: 80px; height: 80px; margin-bottom: 4px; color: var(--icon); }
  .badge-icon svg { width: 80px; height: 80px; display: block; }
  .badge h3 { margin: 0; font-size: 14px; font-weight: 700; }
  @media (max-width: 520px) {
    .wrap { padding: 24px 14px 40px; }
    .badge { flex: 1 1 calc(50% - 5px); max-width: none; padding: 13px 8px 12px; }
    .badge-icon, .badge-icon svg { width: 64px; height: 64px; }
  }
</style>
</head>
